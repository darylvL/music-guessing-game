<div class="settings-container">
  <div class="settings-card">
    <div class="header">
      <button class="back-button" (click)="goBack()" type="button" aria-label="Go back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="title">⚙️ Game Settings</h1>
      <div class="spacer"></div>
    </div>

    <div class="content">
      <div class="section">
        <h2 class="section-title">Game Configuration</h2>
        <p class="section-description">Customize your game experience</p>

      <div class="settings-grid">
        <app-config-tile
          label="Songs per game"
          inputType="stepper"
          [currentValue]="songsPerGame$ | async"
          [min]="3"
          [max]="50"
          [step]="1"
          suffix=" songs"
          (valueChange)="onSongsPerGameChange($event)">
        </app-config-tile>

        <app-config-tile
          label="Preview duration"
          inputType="stepper"
          [currentValue]="previewDuration$ | async"
          [min]="5"
          [max]="60"
          [step]="5"
          suffix=" seconds"
          (valueChange)="onPreviewDurationChange($event)">
        </app-config-tile>
      </div>
      </div>

      <div class="info-section">
      <div class="info-card">
        <div class="info-icon">💡</div>
        <div class="info-content">
          <h3>Tips</h3>
          <ul>
            <li>Shorter preview times make the game more challenging</li>
            <li>More songs = longer game sessions</li>
            <li>Changes are saved in your browser immediately</li>
          </ul>
        </div>
      </div>
      </div>

      <button class="done-button" (click)="goBack()" type="button">
        Done
      </button>
    </div>
  </div>
</div>
