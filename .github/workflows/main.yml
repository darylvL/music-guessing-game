name: Deploy to GitHub Pages via angular-cli-ghpages

on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'code/package-lock.json'

    - name: Replace environment variables
      run: |
        cd code/src/environments
        sed -i "s|__SPOTIFY_CLIENT_ID__|${{ secrets.SPOTIFY_CLIENT_ID }}|g" environment.prod.ts
        sed -i "s|__SPOTIFY_REDIRECT_URI__|${{ secrets.SPOTIFY_REDIRECT_URI }}|g" environment.prod.ts

    - name: Prepare and deploy
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        cd code
        npm install
        # npm run lint
        ###
        # Configure Angular first!
        ####
        # npm test -- --watch=false --progress=false --browsers=ChromeHeadlessCI
        # npm run webdriver-update-ci
        # npm run e2e -- --protractor-config=e2e/protractor-ci.conf.js --webdriver-update=false
        ####
        npm run ng -- deploy
